<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>Course Registration Form</h1>

    <form action="/submit" method="post">

        <h2>Personal Information</h2>

        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname">

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">

        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age">

        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">

        <br><br>

        <label for="website">Personal Website:</label>
        <input type="url" id="website" name="website">

        <br><br>
<div>
        <h2>Education</h2>

        <!-- Radio buttons -->
         

        <p>Education Level:</p>

        <input type="radio" id="school" name="education" value="school">
        <label for="school">High School</label>

        <input type="radio" id="university" name="education" value="university">
        <label for="university">University</label>
</div>
        <br><br>

        <!-- Checkboxes -->

        <p>Skills:</p>

        <input type="checkbox" id="html" name="skills" value="html">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skills" value="css">
        <label for="css">CSS</label>

        <input type="checkbox" id="python" name="skills" value="python">
        <label for="python">Python</label>

        <br><br>

        <h2>Date & Time</h2>

        <label for="birthdate">Birth Date:</label>
        <input type="date" id="birthdate" name="birthdate">

        <br><br>

        <label for="classtime">Preferred Class Time:</label>
        <input type="time" id="classtime" name="classtime">

        <br><br>

        <label for="start">Course Start:</label>
        <input type="datetime-local" id="start" name="start">

        <br><br>

        <label for="month">Starting Month:</label>
        <input type="month" id="month" name="month">

        <br><br>

        <label for="week">Preferred Week:</label>
        <input type="week" id="week" name="week">

        <br><br>

        <h2>Preferences</h2>

        <label for="search">Search Course:</label>
        <input type="search" id="search" name="search">

        <br><br>

        <label for="color">Favorite Color:</label>
        <input type="color" id="color" name="color">

        <br><br>

        <label for="experience">Programming Experience:</label>
        <input type="range" id="experience" name="experience"
               min="0" max="10" value="5">

        <br><br>

        <h2>Upload</h2>

        <label for="cv">Upload CV:</label>
        <input type="file" id="cv" name="cv">

        <br><br>

        <!-- Hidden input -->

        <input type="hidden" name="student_id" value="12345">

        <br>

        <!-- Buttons -->

        <input type="submit" value="Register">

        <input type="reset" value="Clear">

        <input type="button" value="Click Me">

    </form>

</body>
</html>
